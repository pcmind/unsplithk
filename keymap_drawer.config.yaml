# keymap-drawer configuration for unsplithk

parse_config:
  raw_binding_map:
    # --- Portuguese Localized Raw Expressions (Preprocessed with Underscores) ---
    "&hmr LEFT_GUI (ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_SEMICOLON_AND_COLON))": {t: "Ç", h: $$mdi:penguin$$}
    "&kp ((LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_7_AND_AMPERSAND))))": "/"
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_7_AND_AMPERSAND)))": "/"
    "&kp (ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_SLASH_AND_QUESTION_MARK))": "-"
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_SLASH_AND_QUESTION_MARK)))": "_"
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_0_AND_RIGHT_PARENTHESIS)))": "="
    "&kp ((LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_LEFT_BRACKET_AND_LEFT_BRACE))))": "*"
    "&kp (ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_LEFT_BRACKET_AND_LEFT_BRACE))": "+"
    "&kp (ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_GRAVE_ACCENT_AND_TILDE))": "\\"
    "&kp ((ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_GRAVE_ACCENT_AND_TILDE)))": "\\"
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_GRAVE_ACCENT_AND_TILDE)))": "|"
    "&kp (ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_BACKSLASH_AND_PIPE))": "~"
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_BACKSLASH_AND_PIPE)))": "^"

    "&kp (ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_MINUS_AND_UNDERSCORE))": "'"
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_MINUS_AND_UNDERSCORE)))": "?"

    "&kp ((LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_1_AND_EXCLAMATION))))": "!"
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_2_AND_AT)))": "\""


    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_3_AND_HASH)))": "#"

    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_4_AND_DOLLAR)))": "$"
    "&kp (RA(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_E)))": "€"
    "&kp ((RA(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_E))))": "€"
    "&kp ((RA(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_2_AND_AT))))": "@"
    "&kp ((ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_APOSTROPHE_AND_QUOTE)))": "º"
    "&kp ((LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_APOSTROPHE_AND_QUOTE))))": "ª"
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_RIGHT_BRACKET_AND_RIGHT_BRACE)))": "`"
    "&kp (ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_RIGHT_BRACKET_AND_RIGHT_BRACE))": "´"
    "&kp ((LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_6_AND_CARET))))": "&"
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_5_AND_PERCENT)))": "%"

    # --- Combos (Portuguese Keycodes) ---
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_8_AND_ASTERISK)))": "("
    "&kp (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_9_AND_LEFT_PARENTHESIS)))": ")"
    "&kp (RA(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_8_AND_ASTERISK)))": "["
    "&kp (RA(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_9_AND_LEFT_PARENTHESIS)))": "]"
    "&hmr_combo RS(RCTRL) (RA(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_7_AND_AMPERSAND)))": "{"
    "&hmr_combo LA(RCTRL) (RA(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_0_AND_RIGHT_PARENTHESIS)))": "}"
    "&hmr_combo LA(RCTRL) (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_0_AND_RIGHT_PARENTHESIS)))": "="
    "&hml_combo LS(LCTRL) (LS(ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_NON_US_BACKSLASH_AND_PIPE)))": ">"
    "&hml_combo LA(LCTRL) (ZMK_HID_USAGE(HID_USAGE_KEY, HID_USAGE_KEY_KEYBOARD_NON_US_BACKSLASH_AND_PIPE))": "<"


    # --- Tap-Dance Punctuation Mappings ---
    "&td_comma_semi": {t: ",", s: ";"}
    "&td_dot_colon": {t: ".", s: ":"}
    "&td_minus_under": {t: "-", s: "_"}
    "&mm_comma": {t: ",", s: ";"}
    "&mm_dot": {t: ".", s: ":"}
    "&mm_minus": {t: "-", s: "_"}

    # --- Sticky Modifiers ---
    "&sk LC(LSHFT)": "Ctrl+Shift"
    "&sk LC(LALT)": "Ctrl+Alt"

    # --- Custom Hold-Taps (Layer Activations & Comfort Keys) ---
    "&lt_k_repeat 5 TAB": {t: "TAB", h: "FUN"}
    "&lt_k_repeat 1 SPACE": {t: "SPC", h: "NAV"}
    "&my_triple_function": {t: ⮐, h: "CTL"}
    "&lt_k_repeat 4 ENTER": {t: ⮐, h: "SYM"}
    "&lt_k_repeat 2 BACKSPACE": {t: $$mdi:backspace-outline$$, h: "NUM"}
    "&shift_all LEFT_SHIFT 0": {t: "Magic", h: "Shift"}
    "&lrow_layer_to 7 V": {t: "V", h: "MAC"}
    "&soft_off": "Soft Off"

    # --- Mouse Controls ---
    "&mkp MB3": "Middle Click"
    "&mkp LCLK": "Left Click"
    "&mkp RCLK": "Right Click"
    "&mmv MOVE_LEFT": "Mouse Left"
    "&mmv MOVE_DOWN": "Mouse Down"
    "&mmv MOVE_UP": "Mouse Up"
    "&mmv MOVE_RIGHT": "Mouse Right"
    "&msc SCRL_LEFT": "Scroll Left"
    "&msc SCRL_DOWN": "Scroll Down"
    "&msc SCRL_UP": "Scroll Up"
    "&msc SCRL_RIGHT": "Scroll Right"

    # --- Custom Macros (Layer 8) ---
    "&a_tilde_m": "ã"
    "&o_tilde_m": "õ"
    "&tilde_slash_m": "~/"
    "&not_eq_m": "!="
    "&eq_eq_m": "=="
    "&jlambda_m": "->"
    "&eq_gt_m": "=>"
    "&lt_eq_m": "<="
    "&gt_eq_m": ">="

    # --- Navigation / Other Controls ---
    "&key_repeat": "REPEAT"
  zmk_keycode_map:
    EXCLAMATION: '!'
