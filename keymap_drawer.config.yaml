# Styling configuration to make it look premium
draw_config:
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 40.0
  outer_pad_h: 56.0
  append_colon_to_layer_header: true
  svg_extra_style: |
    /* Add subtle shadow and modern rounded aesthetic */
    rect.key {
      stroke: #333;
      stroke-width: 1.5px;
      rx: 8px;
      ry: 8px;
    }
    rect.held {
      fill: #d5e8d4;
      stroke: #82b366;
    }
    text {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 500;
    }
    text.hold {
      fill: #0066cc;
      font-size: 10px;
      font-weight: 600;
    }
