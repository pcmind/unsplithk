    PT_DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    PT_PRCNT: '%'
    CARET: ^
    PT_CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    PT_AMPS: '&'
    ASTERISK: '*'
